# =============================================================================
# Docker Compose: Email Validation Event Processing System
# =============================================================================
#
# KAFKA CONCEPT: What is a Kafka Broker?
# A Kafka broker is the server process that:
#   - Receives messages from producers
#   - Stores them durably on disk (in partitions/segments)
#   - Serves them to consumers on request
#
# In production you'd run 3+ brokers for fault tolerance.
# Here we run 1 broker (sufficient for learning all core concepts).
#
# KAFKA CONCEPT: KRaft Mode (no Zookeeper)
# Traditionally Kafka needed Zookeeper to store metadata (who is the leader,
# what topics exist, etc.). KRaft mode lets Kafka manage this itself using
# the Raft consensus protocol. It simplifies the stack significantly.
# =============================================================================

services:

  # ===========================================================================
  # KAFKA (KRaft mode — combined controller + broker in one container)
  # ===========================================================================
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka
    hostname: kafka
    ports:
      # 9092: Used by services INSIDE Docker (Laravel app, consumers)
      # 29092: Used by tools on your HOST machine (kafka-ui, kafkacat, etc.)
      - "9092:9092"
      - "29092:29092"
    environment:
      # --- KRaft identity ---
      # Each Kafka node needs a unique numeric ID
      KAFKA_NODE_ID: 1

      # This node acts as both controller (metadata) and broker (data)
      KAFKA_PROCESS_ROLES: "broker,controller"

      # The controller quorum — list of controller nodes (just us, node 1)
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      # --- Listeners ---
      # INTERNAL: used inside the Docker network (container-to-container)
      # EXTERNAL: used from your host machine
      # CONTROLLER: used for KRaft leader election, not for clients
      KAFKA_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://kafka:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      # --- Topic defaults ---
      # For learning: replication factor = 1 (we only have 1 broker)
      # In production: replication factor = 3 (survives 2 broker failures)
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 1 # Default. We'll override per-topic.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # --- Log/storage ---
      # How long Kafka retains messages (even after consumers read them)
      # Messages stay on disk and consumers can re-read historical data
      KAFKA_LOG_RETENTION_HOURS: 168 # 7 days
      KAFKA_LOG_SEGMENT_BYTES: 1073741824 # 1 GB per segment file
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000

      # --- Cluster ID (required for KRaft) ---
      # Must be a valid base64-encoded UUID. This is a fixed dev value.
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

      # Auto-create topics if a producer publishes to a non-existent topic.
      # We set this to true for convenience in early phases.
      # In production: false (topics should be explicitly provisioned).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      # Persist Kafka data across container restarts
      - kafka_data:/var/lib/kafka/data
    networks:
      - kafka_net
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ===========================================================================
  # KAFKA UI — Web interface to inspect topics, messages, consumer groups
  # This is optional but extremely useful for learning.
  # ===========================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local-learning"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - kafka_net

  # ===========================================================================
  # POSTGRESQL — Stores email validation results and processed events
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-email_validation}
      POSTGRES_USER: ${DB_USERNAME:-validator}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - kafka_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-validator} -d ${DB_DATABASE:-email_validation}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ===========================================================================
  # LARAVEL APPLICATION
  # ===========================================================================
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: laravel-app
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-email_validation}
      DB_USERNAME: ${DB_USERNAME:-validator}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_EMAIL_VALIDATION_TOPIC: "email-validation"
      KAFKA_EMAIL_VALIDATION_DLQ_TOPIC: "email-validation-dlq"
      KAFKA_CONSUMER_GROUP: "email-validation-workers"
    volumes:
      - ./laravel:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - kafka_net

# =============================================================================
# NAMED VOLUMES
# Docker manages these. Data persists across `docker compose down` restarts.
# Use `docker compose down -v` to also delete volumes (full reset).
# =============================================================================
volumes:
  kafka_data:
    driver: local
  postgres_data:
    driver: local

# =============================================================================
# NETWORK
# All services share one bridge network.
# Services communicate by container name: kafka:9092, postgres:5432
# =============================================================================
networks:
  kafka_net:
    driver: bridge
